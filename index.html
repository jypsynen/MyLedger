<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="theme-color" content="#FBF7EF">
<title>The Ledger — Guesthouse Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF7EF;
    --paper-raised:#FFFEFB;
    --ink:#2B2620;
    --ink-soft:#6B6258;
    --rule:#E3DCC9;
    --rule-strong:#CFC4A8;
    --brass:#C2944A;
    --brass-deep:#9C7530;
    --red:#A1463D;
    --red-bg:#F4E6E2;
    --sage:#5C7A5C;
    --sage-bg:#E8EEE3;
    --shadow: 0 1px 2px rgba(43,38,32,0.06), 0 2px 8px rgba(43,38,32,0.05);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);}
  body{
    font-family:'Inter',-apple-system,sans-serif;
    font-size:15px;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(78px + env(safe-area-inset-bottom));
    padding-top:env(safe-area-inset-top);
    min-height:100vh;
    position:relative;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(43,38,32,0.035) 1px, transparent 0);
    background-size: 14px 14px;
  }
  h1,h2,h3{font-family:'Fraunces',serif; margin:0; letter-spacing:-0.01em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  button{font-family:inherit; cursor:pointer;}
  ::selection{background:var(--brass); color:#fff;}

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:rgba(251,247,239,0.92);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--rule);
    padding:14px 18px 12px;
  }
  .topbar-row{display:flex; align-items:baseline; justify-content:space-between;}
  .brand{display:flex; align-items:baseline; gap:8px;}
  .brand h1{font-size:21px; font-weight:600; font-style:italic;}
  .brand .dot{width:6px;height:6px;border-radius:50%;background:var(--brass);display:inline-block;}
  .month-pill{
    font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600;
    color:var(--brass-deep); background:#fff; border:1px solid var(--rule-strong);
    padding:5px 10px; border-radius:20px; letter-spacing:0.03em; text-transform:uppercase;
    display:flex; align-items:center; gap:6px;
  }
  .month-pill svg{width:11px;height:11px;}

  .cal-toggle-row{display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-top:8px;}
  .cal-toggle-label{font-size:11px; color:var(--ink-soft);}
  .cal-toggle{display:flex; background:#fff; border:1px solid var(--rule-strong); border-radius:20px; padding:2px; gap:2px;}
  .cal-toggle-opt{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:700; padding:4px 10px;
    border-radius:18px; border:none; background:none; color:var(--ink-soft);
  }
  .cal-toggle-opt.selected{background:var(--ink); color:var(--paper);}

  /* ---------- Page container ---------- */
  .page{padding:18px; max-width:600px; margin:0 auto;}
  .page-title{font-size:13px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); font-weight:600; margin-bottom:10px;}

  /* ---------- Stamp badge (signature element) ---------- */
  .stamp{
    width:42px; height:42px; border-radius:50%;
    border:1.5px dashed var(--brass-deep);
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12.5px;
    color:var(--brass-deep); flex-shrink:0; background:var(--paper-raised);
    transform:rotate(-3deg);
  }
  .stamp.occupied{border-style:solid; border-color:var(--red); color:var(--red); background:var(--red-bg);}
  .stamp.vacant{border-style:dashed; border-color:var(--sage); color:var(--sage); background:var(--sage-bg);}
  .stamp.sm{width:32px;height:32px;font-size:10.5px;}

  /* ---------- Cards ---------- */
  .card{
    background:var(--paper-raised); border:1px solid var(--rule);
    border-radius:14px; padding:14px; box-shadow:var(--shadow);
  }
  .card + .card{margin-top:10px;}

  /* ---------- Summary strip ---------- */
  .summary-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:16px;}
  .sum-box{background:var(--paper-raised); border:1px solid var(--rule); border-radius:12px; padding:11px 10px; text-align:left;}
  .sum-box .label{font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); font-weight:600;}
  .sum-box .value{font-family:'JetBrains Mono',monospace; font-size:17px; font-weight:700; margin-top:3px;}
  .sum-box.due .value{color:var(--red);}
  .sum-box.collected .value{color:var(--sage);}

  /* ---------- Booking row ---------- */
  .booking{display:flex; gap:11px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--rule);}
  .booking:last-child{border-bottom:none;}
  .booking-main{flex:1; min-width:0;}
  .booking-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .tenant{font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rent{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:14.5px; white-space:nowrap;}
  .booking-sub{font-size:12px; color:var(--ink-soft); margin-top:2px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .tag{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; padding:2px 7px; border-radius:20px;}
  .tag.paid{background:var(--sage-bg); color:var(--sage);}
  .tag.partial{background:#FBF0DD; color:var(--brass-deep);}
  .tag.due{background:var(--red-bg); color:var(--red);}

  /* ---------- Empty state ---------- */
  .empty{text-align:center; padding:50px 20px; color:var(--ink-soft);}
  .empty svg{width:38px;height:38px; opacity:0.35; margin-bottom:10px;}
  .empty .t{font-family:'Fraunces',serif; font-style:italic; font-size:17px; color:var(--ink); margin-bottom:4px;}
  .empty .s{font-size:13px; max-width:260px; margin:0 auto;}

  /* ---------- FAB ---------- */
  .fab{
    position:fixed; right:18px; bottom:calc(92px + env(safe-area-inset-bottom));
    width:54px; height:54px; border-radius:50%; background:var(--ink);
    color:var(--paper); border:none; box-shadow:0 4px 14px rgba(43,38,32,0.3);
    display:flex; align-items:center; justify-content:center; z-index:30;
    transition:transform 0.15s ease;
  }
  .fab:active{transform:scale(0.92);}
  .fab svg{width:24px;height:24px;}

  /* ---------- Tab bar ---------- */
  .tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:25;
    background:rgba(251,247,239,0.94); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--rule);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    display:flex; justify-content:space-around;
  }
  .tab{
    background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--ink-soft); padding:4px 4px; flex:1; max-width:74px;
  }
  .tab svg{width:20px;height:20px;}
  .tab span{font-size:9.5px; font-weight:600;}
  .tab.active{color:var(--red);}

  /* ---------- Modal / sheet ---------- */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(43,38,32,0.4); z-index:50;
    display:none; align-items:flex-end; justify-content:center;
  }
  .sheet-backdrop.open{display:flex;}
  .sheet{
    background:var(--paper); width:100%; max-width:600px; border-radius:20px 20px 0 0;
    max-height:88vh; overflow-y:auto; padding:18px 18px calc(24px + env(safe-area-inset-bottom));
    animation:slideUp 0.22s ease;
  }
  @keyframes slideUp{from{transform:translateY(100%);} to{transform:translateY(0);}}
  .sheet-handle{width:36px;height:4px;background:var(--rule-strong);border-radius:4px;margin:0 auto 14px;}
  .sheet h2{font-size:19px; font-weight:600; font-style:italic; margin-bottom:14px;}
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); font-weight:600; margin-bottom:6px;}
  .field input, .field select{
    width:100%; padding:11px 12px; border:1px solid var(--rule-strong); border-radius:10px;
    background:#fff; font-size:15px; font-family:inherit; color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--brass);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .room-picker{display:flex; gap:8px; flex-wrap:wrap;}
  .room-opt{
    border:1.5px solid var(--rule-strong); border-radius:10px; padding:8px 12px;
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; background:#fff; color:var(--ink-soft);
  }
  .room-opt.selected{border-color:var(--red); color:var(--red); background:var(--red-bg);}
  .btn-primary{
    width:100%; padding:14px; border-radius:12px; background:var(--ink); color:var(--paper);
    border:none; font-weight:600; font-size:15px; margin-top:6px;
  }
  .btn-primary:active{opacity:0.85;}
  .btn-row{display:flex; gap:10px; margin-top:14px;}
  .btn-row .btn-primary{margin-top:0;}
  .btn-ghost{
    flex:1; padding:14px; border-radius:12px; background:none; border:1.5px solid var(--rule-strong);
    color:var(--ink-soft); font-weight:600; font-size:14px;
  }
  .status-picker{display:flex; gap:8px;}
  .status-opt{flex:1; padding:9px; border-radius:10px; border:1.5px solid var(--rule-strong); font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; background:#fff; color:var(--ink-soft);}
  .status-opt.selected.paid{border-color:var(--sage); background:var(--sage-bg); color:var(--sage);}
  .status-opt.selected.partial{border-color:var(--brass-deep); background:#FBF0DD; color:var(--brass-deep);}
  .status-opt.selected.due{border-color:var(--red); background:var(--red-bg); color:var(--red);}

  /* ---------- Chart page ---------- */
  .chart-wrap{background:var(--paper-raised); border:1px solid var(--rule); border-radius:14px; padding:16px; margin-bottom:12px;}
  .chart-title{font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); font-weight:600; margin-bottom:12px;}
  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:9px;}
  .bar-label{width:62px; font-size:11.5px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; flex-shrink:0;}
  .bar-track{flex:1; height:18px; background:var(--rule); border-radius:4px; overflow:hidden; position:relative;}
  .bar-fill{height:100%; background:linear-gradient(90deg, var(--brass), var(--red)); border-radius:4px; transition:width 0.4s ease;}
  .bar-val{width:64px; text-align:right; font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:700; flex-shrink:0;}

  .room-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  .room-card{background:var(--paper-raised); border:1px solid var(--rule); border-radius:14px; padding:13px; box-shadow:var(--shadow);}
  .room-card .top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;}
  .room-card .meta{font-size:11.5px; color:var(--ink-soft); line-height:1.5;}
  .room-card .meta b{color:var(--ink); font-family:'JetBrains Mono',monospace;}

  .section-divider{display:flex; align-items:center; gap:8px; margin:20px 0 12px; color:var(--ink-soft);}
  .section-divider .line{flex:1; height:1px; background:var(--rule);}
  .section-divider span{font-size:11px; text-transform:uppercase; letter-spacing:0.07em; font-weight:600;}

  /* ---------- Expenses ---------- */
  .cat-chip{
    display:inline-flex; align-items:center; font-size:10px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.04em; padding:2px 8px; border-radius:20px; background:#EFE9DA; color:var(--ink-soft);
  }
  .expense-amt{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:14.5px; white-space:nowrap; color:var(--red);}
  .cat-picker{display:flex; gap:8px; flex-wrap:wrap;}
  .cat-opt{
    border:1.5px solid var(--rule-strong); border-radius:10px; padding:8px 12px;
    font-size:12.5px; font-weight:600; background:#fff; color:var(--ink-soft);
  }
  .cat-opt.selected{border-color:var(--brass-deep); color:var(--brass-deep); background:#FBF0DD;}
  .net-box .value{font-size:17px;}
  .net-box.positive .value{color:var(--sage);}
  .net-box.negative .value{color:var(--red);}

  .swipe-hint{font-size:11px; color:var(--ink-soft); text-align:center; margin-top:6px;}

  /* ---------- Receipt capture ---------- */
  .receipt-slot{
    border:1.5px dashed var(--rule-strong); border-radius:12px; background:var(--paper-raised);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:18px 14px; gap:8px; text-align:center;
  }
  .receipt-slot .icon-circle{
    width:38px; height:38px; border-radius:50%; background:#FBF0DD; border:1px solid var(--rule-strong);
    display:flex; align-items:center; justify-content:center;
  }
  .receipt-slot .icon-circle svg{width:18px;height:18px; color:var(--brass-deep);}
  .receipt-slot .hint{font-size:11.5px; color:var(--ink-soft);}
  .receipt-btn-row{display:flex; gap:8px; width:100%; margin-top:4px;}
  .receipt-btn{
    flex:1; padding:9px 8px; border-radius:9px; border:1.5px solid var(--rule-strong);
    background:#fff; font-size:12px; font-weight:700; color:var(--ink);
    display:flex; align-items:center; justify-content:center; gap:5px;
  }
  .receipt-btn svg{width:14px;height:14px;}
  .receipt-btn.scan{border-color:var(--brass-deep); color:var(--brass-deep); background:#FBF0DD;}
  .receipt-preview{position:relative; border-radius:12px; overflow:hidden; border:1px solid var(--rule);}
  .receipt-preview img{width:100%; max-height:220px; object-fit:cover; display:block;}
  .receipt-preview .remove-receipt{
    position:absolute; top:8px; right:8px; width:28px; height:28px; border-radius:50%;
    background:rgba(43,38,32,0.65); color:#fff; display:flex; align-items:center; justify-content:center; border:none;
  }
  .receipt-preview .remove-receipt svg{width:14px;height:14px;}
  .scan-status{
    display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:10px;
    background:#FBF0DD; border:1px solid var(--rule-strong); font-size:12.5px; color:var(--brass-deep); font-weight:600;
  }
  .scan-status.error{background:var(--red-bg); color:var(--red); border-color:var(--red);}
  .spinner{
    width:14px; height:14px; border-radius:50%; border:2px solid rgba(156,117,48,0.25); border-top-color:var(--brass-deep);
    animation:spin 0.7s linear infinite; flex-shrink:0;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .receipt-thumb-link{font-size:11px; color:var(--brass-deep); text-decoration:underline; font-weight:600;}

  /* ---------- Dual calendar date entry ---------- */
  .date-field-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .date-field-head label{margin-bottom:0;}
  .cal-mini-toggle{display:flex; background:#fff; border:1px solid var(--rule-strong); border-radius:14px; padding:2px;}
  .cal-mini-opt{font-family:'JetBrains Mono',monospace; font-size:9.5px; font-weight:700; padding:2px 7px; border-radius:12px; border:none; background:none; color:var(--ink-soft);}
  .cal-mini-opt.selected{background:var(--brass-deep); color:#fff;}
  .bs-select-row{display:grid; grid-template-columns:1fr 1.3fr 1fr; gap:6px;}
  .bs-select-row select{padding:10px 6px; font-size:13px;}
  .date-convert-preview{font-size:11px; color:var(--brass-deep); margin-top:5px; font-family:'JetBrains Mono',monospace;}
  .date-convert-preview.invalid{color:var(--red);}

  .toast{
    position:fixed; bottom:calc(100px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:30px; font-size:13px; font-weight:600;
    z-index:60; opacity:0; transition:opacity 0.25s, transform 0.25s; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div class="brand"><span class="dot"></span><h1>The Ledger</h1></div>
    <div class="month-pill" id="monthPill">Baisakh 2083</div>
  </div>
  <div class="cal-toggle-row">
    <span class="cal-toggle-label">Dates shown in</span>
    <div class="cal-toggle" id="calToggle">
      <button type="button" class="cal-toggle-opt" data-fmt="AD">A.D.</button>
      <button type="button" class="cal-toggle-opt" data-fmt="BS">B.S.</button>
    </div>
  </div>
</div>

<div id="app" class="page"></div>

<button class="fab" id="fabAdd" aria-label="Add booking">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="tabbar">
  <button class="tab active" data-tab="bookings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a1 1 0 0 1 1-1h11l4 4v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Z"/><path d="M8 8h6M8 12h8M8 16h5"/></svg>
    <span>Bookings</span>
  </button>
  <button class="tab" data-tab="rooms">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    <span>Rooms</span>
  </button>
  <button class="tab" data-tab="expenses">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"/><path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4Z"/></svg>
    <span>Expenses</span>
  </button>
  <button class="tab" data-tab="charts">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 16l4-5 3 3 5-7"/></svg>
    <span>Revenue</span>
  </button>
  <button class="tab" data-tab="months">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    <span>Months</span>
  </button>
</div>

<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet" id="sheet"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ DATA LAYER ============ */
const ROOMS = ["101","102","201","202","203","301","302"];
const NEPALI_MONTHS = ["Baisakh","Jestha","Asadh","Shrawan","Vadra","Ashoj","Kartik","Mangsir","Poush","Magh","Falgun","Chaitra"];
const NEPALI_MONTHS_SHORT = ["Bai","Jes","Asa","Shr","Bha","Aso","Kar","Man","Pou","Mag","Fal","Cha"];
const STORE_KEY = "ledger_bookings_v1";
const STATE_KEY = "ledger_state_v1";

/* ---------- Bikram Sambat <-> Gregorian conversion ----------
   Reference data: days-in-month for BS 1970-2090 (covers AD ~1913-2034),
   sourced from the widely-used medic/bikram-sambat conversion tables.
   Epoch: 1 Baisakh 1970 BS = 13 April 1913 AD (verified against multiple
   independent converters). All internal date math below is exact, not
   approximated — no fixed-offset shortcuts. */
const DAYS_IN_MONTH_BS = {
1970:[31,31,32,31,31,31,30,29,30,29,30,30], 1971:[31,31,32,31,32,30,30,29,30,29,30,30],
1972:[31,32,31,32,31,30,30,30,29,29,30,31], 1973:[30,32,31,32,31,30,30,30,29,30,29,31],
1974:[31,31,32,31,31,31,30,29,30,29,30,30], 1975:[31,31,32,32,30,31,30,29,30,29,30,30],
1976:[31,32,31,32,31,30,30,30,29,29,30,31], 1977:[30,32,31,32,31,30,30,30,29,30,29,31],

const BS_EPOCH_YEAR = 1970;
const BS_EPOCH_AD_MS = Date.UTC(1913, 3, 13); // 13 April 1913 = 1 Baisakh 1970 BS
const BS_MIN_YEAR = 1970, BS_MAX_YEAR = 2089; // last year with full 12-month data available

function bsDaysInMonth(year, month){
  const arr = DAYS_IN_MONTH_BS[year];
  return arr ? arr[month-1] : null;
}
// True Gregorian (AD) ISO date -> {year,month,day} in Bikram Sambat
function adToBs(adIso){
  const target = Date.UTC(...adIso.split('-').map((v,i)=> i===1 ? Number(v)-1 : Number(v)));
  let days = Math.round((target - BS_EPOCH_AD_MS) / 86400000);
  if(days < 0) return null;
  let year = BS_EPOCH_YEAR;
  while(year <= BS_MAX_YEAR){
    const monthsArr = DAYS_IN_MONTH_BS[year];
    if(!monthsArr) return null;
    for(let m=0;m<12;m++){
      const dim = monthsArr[m];
      if(days < dim) return {year, month:m+1, day:days+1};
      days -= dim;
    }
    year++;
  }
  return null;
}
// Bikram Sambat {year,month,day} -> true Gregorian (AD) ISO date string
function bsToAdIso(year, month, day){
  if(year < BS_MIN_YEAR || year > BS_MAX_YEAR) return null;
  const monthsArr = DAYS_IN_MONTH_BS[year];
  if(!monthsArr || month<1 || month>12 || day<1 || day>monthsArr[month-1]) return null;
  let totalDays = 0;
  for(let y=BS_EPOCH_YEAR; y<year; y++){
    const arr = DAYS_IN_MONTH_BS[y];
    if(!arr) return null;
    totalDays += arr.reduce((a,b)=>a+b,0);
  }
  for(let m=0; m<month-1; m++) totalDays += monthsArr[m];
  totalDays += (day-1);
  const ms = BS_EPOCH_AD_MS + totalDays*86400000;
  const d = new Date(ms);
  const yy = d.getUTCFullYear(), mm = String(d.getUTCMonth()+1).padStart(2,'0'), dd = String(d.getUTCDate()).padStart(2,'0');
  return `${yy}-${mm}-${dd}`;
}
function bsIsoToAdIso(bsIso){
  if(!bsIso) return null;
  const [y,m,d] = bsIso.split('-').map(Number);
  return bsToAdIso(y,m,d);
}
function adIsoToBsIso(adIso){
  if(!adIso) return null;
  const bs = adToBs(adIso);
  if(!bs) return null;
  return `${bs.year}-${String(bs.month).padStart(2,'0')}-${String(bs.day).padStart(2,'0')}`;
}
// Convert a stored date (which may itself be tagged AD or BS) to a true AD iso string for math
function toTrueAdIso(dateStr, cal){
  if(!dateStr) return null;
  return cal === 'BS' ? bsIsoToAdIso(dateStr) : dateStr;
}
// Format a stored date for DISPLAY in the user's chosen display calendar
function displayDate(dateStr, cal){
  if(!dateStr) return '—';
  const trueAd = toTrueAdIso(dateStr, cal);
  if(!trueAd) return '—';
  if(state.dateFormat === 'BS'){
    const bsIso = adIsoToBsIso(trueAd);
    if(!bsIso) return '—';
    const [y,m,d] = bsIso.split('-');
    return `${d}.${m}.${y} BS`;
  } else {
    const [y,m,d] = trueAd.split('-');
    return `${d}.${m}.${y} AD`;
  }
}

/* ============ HELPERS ============ */
function fmt(n){ return Number(n||0).toLocaleString('en-IN'); }
function statusOf(b){
  if(b.collected >= b.base && b.base>0) return "paid";
  if(b.collected > 0) return "partial";
  return "due";
}
function daysOf(b){
  if(!b.checkIn || !b.checkOut) return "—";
  const adIn = toTrueAdIso(b.checkIn, b.cal);
  const adOut = toTrueAdIso(b.checkOut, b.cal);
  if(!adIn || !adOut) return "—";
  const a = new Date(adIn+'T00:00:00Z'), c = new Date(adOut+'T00:00:00Z');
  const diff = Math.round((c-a)/(1000*60*60*24));
  return diff>0 ? diff : "—";
}
function dDate(s, cal){
  return displayDate(s, cal);
}
function monthBookings(mi){ return bookings.filter(b=>b.month===mi); }
function monthTotals(mi){
  const list = monthBookings(mi);
  const collected = list.reduce((s,b)=>s+Number(b.collected||0),0);
  const due = list.reduce((s,b)=>s+Math.max(0,Number(b.base||0)-Number(b.collected||0)),0);
  const expected = list.reduce((s,b)=>s+Number(b.base||0),0);
  return {collected, due, expected, count:list.length};
}
function monthExpenses(mi){ return expenses.filter(e=>e.month===mi); }
function monthExpenseTotal(mi){
  return monthExpenses(mi).reduce((s,e)=>s+Number(e.amount||0),0);
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1700);
}

          <div><b>${stays.length}</b> booking${stays.length===1?'':'s'}</div>
          <div><b>${nights}</b> nights filled</div>
          <div>₨<b>${fmt(collected)}</b> collected</div>
        </div>
      </div>`;
  });
  html += `</div>`;

  // all-time per room totals
  const allTimeByRoom = {};
  ROOMS.forEach(r=>allTimeByRoom[r]=0);
  bookings.forEach(b=>{ if(allTimeByRoom[b.room]!==undefined) allTimeByRoom[b.room]+=Number(b.collected||0); });
  const maxAll = Math.max(1,...Object.values(allTimeByRoom));

  html += `<div class="section-divider"><span>All-time by room</span><div class="line"></div></div>`;
  html += `<div class="chart-wrap">`;
  ROOMS.forEach(r=>{
    const v = allTimeByRoom[r];
    html += `
      <div class="bar-row">
        <div class="bar-label">${r}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(v/maxAll*100).toFixed(1)}%"></div></div>
        <div class="bar-val mono">₨${fmt(v)}</div>
      </div>`;
  });
  html += `</div>`;
  document.getElementById('app').innerHTML = html;
}

/* ============ RENDER: EXPENSES TAB ============ */

  list.forEach(e=>{ byPayer[e.paidBy||'Unassigned'] = (byPayer[e.paidBy||'Unassigned']||0) + Number(e.amount||0); });

  let html = `
    <div class="summary-grid">
      <div class="sum-box due"><div class="label">Spent</div><div class="value mono">₨${fmt(total)}</div></div>

      <div class="sum-box"><div class="label">Net</div><div class="value mono">₨${fmt(monthTotals(mi).collected - total)}</div></div>

      <div class="empty">

        <div class="t">No expenses yet for ${NEPALI_MONTHS[mi]}</div>
        <div class="s">Tap the + button to log a purchase, utility bill, or other spend.</div>

        <div class="booking" data-id="${e.id}" onclick="openEditExpense('${e.id}')">
          <div class="stamp sm vacant" style="border-color:var(--brass-deep); color:var(--brass-deep); background:#FBF0DD;">${(e.category||'').slice(0,2).toUpperCase()}</div>
          <div class="booking-main">
            <div class="booking-top">
              <div class="tenant">${esc(e.vendor) || esc(e.category) || 'Expense'}</div>
              <div class="expense-amt mono">−₨${fmt(e.amount)}</div>
            </div>
            <div class="booking-sub">
              <span class="cat-chip">${esc(e.category)}</span>
              <span>·</span>
              <span>${esc(e.method)}</span>
              ${e.paidBy ? `<span>· paid by ${esc(e.paidBy)}</span>` : ''}
              ${e.receipt ? `<span style="color:var(--brass-deep);">· 📎 receipt</span>` : ''}
            </div>
            ${e.note ? `<div class="booking-sub" style="margin-top:4px;">${esc(e.note)}</div>` : ''}
          </div>
        </div>`;
    });
    html += `</div>`;
  }
  document.getElementById('app').innerHTML = html;
}


/* ============ RENDER: CHARTS TAB ============ */
function renderCharts(){
  const monthData = NEPALI_MONTHS.map((name,i)=>({name, i, ...monthTotals(i), expenseTotal: monthExpenseTotal(i)}));
  monthData.forEach(m=>{ m.net = m.collected - m.expenseTotal; });
  const maxVal = Math.max(1, ...monthData.map(m=>Math.max(m.collected, m.due, m.expenseTotal)));
  const yearTotal = monthData.reduce((s,m)=>s+m.collected,0);
  const yearDue = monthData.reduce((s,m)=>s+m.due,0);
  const yearExpenses = monthData.reduce((s,m)=>s+m.expenseTotal,0);
  const yearNet = yearTotal - yearExpenses;

  let html = `
    <div class="summary-grid">
      <div class="sum-box collected"><div class="label">Year collected</div><div class="value mono">₨${fmt(yearTotal)}</div></div>
      <div class="sum-box due"><div class="label">Year spent</div><div class="value mono">₨${fmt(yearExpenses)}</div></div>
      <div class="sum-box net-box ${yearNet>=0?'positive':'negative'}"><div class="label">Net profit</div><div class="value mono">₨${fmt(yearNet)}</div></div>
    </div>
    <div class="chart-wrap">
      <div class="chart-title">Collected vs. spent — 2083</div>
  `;
  monthData.forEach(m=>{
    html += `
      <div class="bar-row">
        <div class="bar-label">${m.name.slice(0,3)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(m.collected/maxVal*100).toFixed(1)}%"></div></div>
        <div class="bar-val mono">₨${fmt(m.collected)}</div>
      </div>`;
    if(m.expenseTotal>0){
      html += `
      <div class="bar-row" style="margin-top:-3px; margin-bottom:12px;">
        <div class="bar-label"></div>
        <div class="bar-track" style="height:10px;"><div class="bar-fill" style="width:${(m.expenseTotal/maxVal*100).toFixed(1)}%; background:linear-gradient(90deg, #8a8270, var(--ink-soft)); height:100%;"></div></div>
        <div class="bar-val mono" style="color:var(--ink-soft); font-size:10.5px;">−₨${fmt(m.expenseTotal)}</div>
      </div>`;
    }
  });
  html += `</div>`;

  html += `<div class="section-divider"><span>Net profit by month</span><div class="line"></div></div><div class="chart-wrap">`;
  const maxNet = Math.max(1, ...monthData.map(m=>Math.abs(m.net)));
  monthData.forEach(m=>{
    if(m.collected===0 && m.expenseTotal===0) return;
    const isNeg = m.net < 0;
    html += `
      <div class="bar-row">
        <div class="bar-label">${m.name.slice(0,3)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(Math.abs(m.net)/maxNet*100).toFixed(1)}%; background:${isNeg ? 'linear-gradient(90deg, var(--red), #7a3530)' : 'linear-gradient(90deg, var(--sage), #3f5a3f)'};"></div></div>
        <div class="bar-val mono" style="color:${isNeg?'var(--red)':'var(--sage)'}">${isNeg?'−':''}₨${fmt(Math.abs(m.net))}</div>
      </div>`;
  });
  html += `</div>`;

  const dueMonths = monthData.filter(m=>m.due>0);
  if(dueMonths.length){
    html += `<div class="section-divider"><span>Outstanding dues</span><div class="line"></div></div><div class="chart-wrap">`;
    dueMonths.forEach(m=>{
      html += `
        <div class="bar-row">
          <div class="bar-label">${m.name.slice(0,3)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(m.due/maxVal*100).toFixed(1)}%; background:linear-gradient(90deg, var(--red), #7a3530);"></div></div>
          <div class="bar-val mono" style="color:var(--red)">₨${fmt(m.due)}</div>
        </div>`;
    });
    html += `</div>`;
  }
  document.getElementById('app').innerHTML = html;
}

/* ============ TAB SWITCHING ============ */
function switchTab(tab){
  state.tab = tab; saveState();
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===tab));
  document.getElementById('fabAdd').style.display = (tab==='bookings' || tab==='expenses') ? 'flex' : 'none';
  if(tab==='bookings') renderBookings();
  else if(tab==='rooms') renderRooms();
  else if(tab==='expenses') renderExpenses();
  else if(tab==='charts') renderCharts();
  else if(tab==='months') renderMonths();
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>switchTab(t.dataset.tab)));

/* ============ ADD / EDIT SHEET ============ */

function openAdd(){

  editingId = null;

}

function renderSheet(b){
  const isEdit = !!editingId;
  const html = `
    <div class="sheet-handle"></div>
    <h2>${isEdit ? 'Edit booking' : 'New booking'}</h2>

    <div class="field">
      <label>Room</label>
      <div class="room-picker" id="roomPicker">
        ${ROOMS.map(r=>`<button type="button" class="room-opt ${r===b.room?'selected':''}" data-room="${r}">${r}</button>`).join('')}
      </div>
    </div>

    <div class="field">
      <label>Guest name</label>
      <input type="text" id="f_name" value="${esc(b.name)}" placeholder="e.g. Bishal Chhetri">
    </div>

    <div class="field">
      <div class="date-field-head">
        <label style="margin-bottom:0;">Check-in</label>
        <div class="cal-mini-toggle" id="calToggleIn">
          <button type="button" class="cal-mini-opt" data-cal="AD">A.D.</button>
          <button type="button" class="cal-mini-opt" data-cal="BS">B.S.</button>
        </div>
      </div>
      <div id="dateAreaIn"></div>
      <div class="date-convert-preview" id="previewIn"></div>
    </div>

    <div class="field">
      <div class="date-field-head">
        <label style="margin-bottom:0;">Check-out</label>
        <div class="cal-mini-toggle" id="calToggleOut">
          <button type="button" class="cal-mini-opt" data-cal="AD">A.D.</button>
          <button type="button" class="cal-mini-opt" data-cal="BS">B.S.</button>
        </div>
      </div>
      <div id="dateAreaOut"></div>
      <div class="date-convert-preview" id="previewOut"></div>
    </div>

    <div class="row2">
      <div class="field">
        <label>Base rent (₨)</label>
        <input type="number" id="f_base" value="${b.base||''}" placeholder="0" inputmode="numeric">
      </div>
      <div class="field">
        <label>Collected (₨)</label>
        <input type="number" id="f_collected" value="${b.collected||''}" placeholder="0" inputmode="numeric">
      </div>
    </div>

    <div class="field">
      <label>Payment status</label>
      <div class="status-picker" id="statusPicker">
        <button type="button" class="status-opt paid ${statusOf(b)==='paid'?'selected':''}" data-st="paid">Paid</button>
        <button type="button" class="status-opt partial ${statusOf(b)==='partial'?'selected':''}" data-st="partial">Partial</button>
        <button type="button" class="status-opt due ${statusOf(b)==='due'?'selected':''}" data-st="due">Due</button>
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label>Channel</label>
        <select id="f_channel">
          ${['Direct','Booking','Agoda','Walk-in','Other'].map(c=>`<option ${c===b.channel?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Payment method</label>
        <select id="f_pay">
          ${['Cash','Esewa','Phonepay','Nabil Bank','Atm','Agoda','Other'].map(c=>`<option ${c===b.pay?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="field">
      <label>Month</label>
      <select id="f_month">
        ${NEPALI_MONTHS.map((m,i)=>`<option value="${i}" ${i===b.month?'selected':''}>${m}</option>`).join('')}
      </select>
    </div>

    <div class="btn-row">
      ${isEdit ? `<button type="button" class="btn-ghost" id="deleteBtn" style="color:var(--red); border-color:var(--red);">Delete</button>` : ''}
      <button type="button" class="btn-primary" id="saveBtn">${isEdit?'Save changes':'Add booking'}</button>
    </div>
  `;
  document.getElementById('sheet').innerHTML = html;
  document.getElementById('sheetBackdrop').classList.add('open');

  /* ---- Dual A.D./B.S. date entry widget ---- */
  // Each booking stores ONE calendar tag (b.cal) shared by both dates, since in
  // practice a person enters both check-in/out in the same calendar in one sitting.
  let entryCal = b.cal || 'AD';
  const dateState = { checkIn: b.checkIn || '', checkOut: b.checkOut || '' };

  function bsPartsFromAdIso(adIso){
    if(!adIso) return null;
    const bs = adToBs(adIso);
    return bs;
  }
  function buildYearOptions(centerYear){
    const opts = [];
    for(let y=BS_MIN_YEAR; y<=BS_MAX_YEAR; y++) opts.push(y);
    return opts;
  }
  function renderDateInput(key, areaId, previewId){
    const area = document.getElementById(areaId);
    const currentVal = dateState[key]; // stored in entryCal's terms
    if(entryCal === 'AD'){
      area.innerHTML = `<input type="date" class="dateInput" data-key="${key}" value="${currentVal||''}">`;
      const inp = area.querySelector('.dateInput');
      inp.addEventListener('change', ()=>{
        dateState[key] = inp.value;
        updatePreview(key, previewId);
      });
    } else {
      // BS mode: year/month/day selects
      let bsParts = null;
      if(currentVal){
        const [yy,mm,dd] = currentVal.split('-').map(Number);
        bsParts = {year:yy, month:mm, day:dd};
      }
      const todayBs = adToBs(new Date().toISOString().slice(0,10)) || {year:2083,month:1,day:1};
      const yr = bsParts ? bsParts.year : todayBs.year;
      const mo = bsParts ? bsParts.month : todayBs.month;
      const dimArr = DAYS_IN_MONTH_BS[yr] || DAYS_IN_MONTH_BS[todayBs.year];
      const dayCount = dimArr ? dimArr[mo-1] : 30;
      const dy = bsParts ? Math.min(bsParts.day, dayCount) : todayBs.day;

      area.innerHTML = `
        <div class="bs-select-row">
          <select class="bsYear" data-key="${key}">
            ${buildYearOptions().map(y=>`<option value="${y}" ${y===yr?'selected':''}>${y}</option>`).join('')}
          </select>
          <select class="bsMonth" data-key="${key}">
            ${NEPALI_MONTHS.map((m,i)=>`<option value="${i+1}" ${i+1===mo?'selected':''}>${m}</option>`).join('')}
          </select>
          <select class="bsDay" data-key="${key}">
            ${Array.from({length:dayCount},(_,i)=>i+1).map(d=>`<option value="${d}" ${d===dy?'selected':''}>${d}</option>`).join('')}
          </select>
        </div>`;
      function syncFromSelects(){
        const yEl = area.querySelector('.bsYear'), mEl = area.querySelector('.bsMonth'), dEl = area.querySelector('.bsDay');
        const y = Number(yEl.value), m = Number(mEl.value);
        const dim = (DAYS_IN_MONTH_BS[y]||[])[m-1] || 30;
        // rebuild day options if month/year changed and day count differs
        const currentDayOptCount = dEl.options.length;
        if(currentDayOptCount !== dim){
          const keepDay = Math.min(Number(dEl.value)||1, dim);
          dEl.innerHTML = Array.from({length:dim},(_,i)=>i+1).map(d=>`<option value="${d}" ${d===keepDay?'selected':''}>${d}</option>`).join('');
        }
        const d = Number(dEl.value);
        dateState[key] = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        updatePreview(key, previewId);
      }
      area.querySelectorAll('select').forEach(sel=>sel.addEventListener('change', syncFromSelects));
      // ensure dateState has an initial value even before user touches selects
      if(!currentVal) syncFromSelects();
    }
    updatePreview(key, previewId);
  }
  function updatePreview(key, previewId){
    const el = document.getElementById(previewId);
    const val = dateState[key];
    if(!val){ el.textContent=''; return; }
    if(entryCal === 'AD'){
      const bsIso = adIsoToBsIso(val);
      if(!bsIso){ el.textContent = 'Outside convertible range (1913–2034 AD)'; el.classList.add('invalid'); return; }
      const [y,m,d] = bsIso.split('-');
      el.classList.remove('invalid');
      el.textContent = `= ${d} ${NEPALI_MONTHS[Number(m)-1]} ${y} B.S.`;
    } else {
      const [y,m,d] = val.split('-').map(Number);
      const adIso = bsToAdIso(y,m,d);
      if(!adIso){ el.textContent = 'Invalid B.S. date'; el.classList.add('invalid'); return; }
      const [ay,am,ad] = adIso.split('-');
      el.classList.remove('invalid');
      const monthNamesAd = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      el.textContent = `= ${ad} ${monthNamesAd[Number(am)-1]} ${ay} A.D.`;
    }
  }
  function refreshCalMiniToggles(){
    document.querySelectorAll('#calToggleIn .cal-mini-opt, #calToggleOut .cal-mini-opt').forEach(el=>{
      el.classList.toggle('selected', el.dataset.cal === entryCal);
    });
  }
  function rerenderBothDateInputs(){
    renderDateInput('checkIn', 'dateAreaIn', 'previewIn');
    renderDateInput('checkOut', 'dateAreaOut', 'previewOut');
  }
  function switchEntryCal(newCal){
    if(newCal === entryCal) return;
    // convert currently-held values into the new calendar so nothing is lost
    ['checkIn','checkOut'].forEach(key=>{
      const val = dateState[key];
      if(!val) return;
      if(entryCal === 'AD' && newCal === 'BS'){
        const bsIso = adIsoToBsIso(val);
        if(bsIso) dateState[key] = bsIso;
      } else if(entryCal === 'BS' && newCal === 'AD'){
        const [y,m,d] = val.split('-').map(Number);
        const adIso = bsToAdIso(y,m,d);
        if(adIso) dateState[key] = adIso;
      }
    });
    entryCal = newCal;
    refreshCalMiniToggles();
    rerenderBothDateInputs();
  }
  document.querySelectorAll('#calToggleIn .cal-mini-opt, #calToggleOut .cal-mini-opt').forEach(el=>{
    el.addEventListener('click', ()=>switchEntryCal(el.dataset.cal));
  });
  refreshCalMiniToggles();
  rerenderBothDateInputs();

  let selectedRoom = b.room;
  let selectedStatus = statusOf(b);
  document.querySelectorAll('#roomPicker .room-opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      selectedRoom = el.dataset.room;
      document.querySelectorAll('#roomPicker .room-opt').forEach(x=>x.classList.remove('selected'));
      el.classList.add('selected');
    });
  });
  document.querySelectorAll('#statusPicker .status-opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      selectedStatus = el.dataset.st;
      document.querySelectorAll('#statusPicker .status-opt').forEach(x=>x.classList.remove('selected'));
      el.classList.add('selected');
      // auto-fill collected based on status choice if collected is empty/zero
      const baseVal = Number(document.getElementById('f_base').value||0);
      const collEl = document.getElementById('f_collected');
      if(selectedStatus==='paid') collEl.value = baseVal||collEl.value;
      if(selectedStatus==='due') collEl.value = 0;
    });
  });

  document.getElementById('saveBtn').addEventListener('click', ()=>{
    const name = document.getElementById('f_name').value.trim();
    const checkIn = dateState.checkIn;
    const checkOut = dateState.checkOut;
    const base = Number(document.getElementById('f_base').value||0);
    let collected = Number(document.getElementById('f_collected').value||0);
    const channel = document.getElementById('f_channel').value;
    const pay = document.getElementById('f_pay').value;
    const month = Number(document.getElementById('f_month').value);

    if(!name){ toast('Add a guest name'); return; }
    if(!checkIn){ toast('Add a check-in date'); return; }

    const rec = {
      id: editingId || Math.random().toString(36).slice(2,9),
      room: selectedRoom, name, checkIn, checkOut, cal: entryCal, base, collected,
      channel, pay, month
    };

    if(editingId){
      const idx = bookings.findIndex(x=>x.id===editingId);
      bookings[idx] = rec;
      toast('Booking updated');
    } else {
      bookings.push(rec);
      toast('Booking added');
    }
    saveBookings();
    closeSheet();
    switchTab(state.tab);
  });

  const delBtn = document.getElementById('deleteBtn');
  if(delBtn){
    delBtn.addEventListener('click', ()=>{
      bookings = bookings.filter(x=>x.id!==editingId);
      saveBookings();
      closeSheet();
      toast('Booking deleted');
      switchTab(state.tab);
    });
  }
}

      <label>Receipt</label>
      <div id="receiptArea">
        ${hasReceipt ? `
          <div class="receipt-preview" id="receiptPreview">
            <img src="${e.receipt}" alt="Receipt photo">
            <button type="button" class="remove-receipt" id="removeReceiptBtn" aria-label="Remove receipt">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>
        ` : `
          <div class="receipt-slot" id="receiptSlot">
            <div class="icon-circle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h2l1.5-2h9L18 7h2a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></svg>
            </div>
            <div class="hint">Snap the receipt to keep a copy, or let it read the amount for you</div>
            <div class="receipt-btn-row">
              <button type="button" class="receipt-btn scan" id="scanReceiptBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="3"/></svg>
                Scan &amp; fill
              </button>
              <button type="button" class="receipt-btn" id="attachReceiptBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h2l1.5-2h9L18 7h2a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></svg>
                Just attach
              </button>
            </div>
          </div>
        `}
        <input type="file" id="receiptFileScan" accept="image/*" capture="environment" style="display:none;">
        <input type="file" id="receiptFileAttach" accept="image/*" capture="environment" style="display:none;">
      </div>
      <div id="scanStatusArea"></div>
    </div>

    <div class="field">
      <label>Category</label>
      <div class="cat-picker" id="catPicker">
        ${EXPENSE_CATEGORIES.map(c=>`<button type="button" class="cat-opt ${c===e.category?'selected':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label>Amount (₨)</label>
        <input type="number" id="ex_amount" value="${e.amount||''}" placeholder="0" inputmode="numeric">
      </div>
      <div class="field">
        <label>Month</label>
        <select id="ex_month">
          ${NEPALI_MONTHS.map((m,i)=>`<option value="${i}" ${i===e.month?'selected':''}>${m}</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="field">
      <label>Vendor / paid to</label>
      <input type="text" id="ex_vendor" value="${esc(e.vendor)}" placeholder="e.g. local hardware store">
    </div>

    <div class="row2">
      <div class="field">
        <label>Paid by</label>
        <input type="text" id="ex_paidby" value="${esc(e.paidBy)}" placeholder="e.g. Sarina, Jeewan">
      </div>
      <div class="field">
        <label>Payment method</label>
        <select id="ex_method">
          ${['Cash','Esewa','Phonepay','Nabil Bank','Atm','Other'].map(c=>`<option ${c===e.method?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="field">
      <label>Note</label>
      <input type="text" id="ex_note" value="${esc(e.note)}" placeholder="optional detail">
    </div>

    <div class="btn-row">
      ${isEdit ? `<button type="button" class="btn-ghost" id="deleteExBtn" style="color:var(--red); border-color:var(--red);">Delete</button>` : ''}
      <button type="button" class="btn-primary" id="saveExBtn">${isEdit?'Save changes':'Add expense'}</button>
    </div>
  `;
  document.getElementById('sheet').innerHTML = html;
  document.getElementById('sheetBackdrop').classList.add('open');

  let selectedCat = e.category;
  let receiptData = e.receipt || null;
  document.querySelectorAll('#catPicker .cat-opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      selectedCat = el.dataset.cat;
      document.querySelectorAll('#catPicker .cat-opt').forEach(x=>x.classList.remove('selected'));
      el.classList.add('selected');
    });
  });

  /* ---- Receipt capture wiring ---- */
  function setScanStatus(html){
    document.getElementById('scanStatusArea').innerHTML = html;
  }
  function showReceiptPreview(dataUrl){
    receiptData = dataUrl;
    document.getElementById('receiptArea').innerHTML = `
      <div class="receipt-preview" id="receiptPreview">
        <img src="${dataUrl}" alt="Receipt photo">
        <button type="button" class="remove-receipt" id="removeReceiptBtn" aria-label="Remove receipt">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <input type="file" id="receiptFileScan" accept="image/*" capture="environment" style="display:none;">
      <input type="file" id="receiptFileAttach" accept="image/*" capture="environment" style="display:none;">
    `;
    wireRemoveReceipt();
  }
  function showReceiptSlot(){
    receiptData = null;
    document.getElementById('receiptArea').innerHTML = `
      <div class="receipt-slot" id="receiptSlot">
        <div class="icon-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h2l1.5-2h9L18 7h2a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </div>
        <div class="hint">Snap the receipt to keep a copy, or let it read the amount for you</div>
        <div class="receipt-btn-row">
          <button type="button" class="receipt-btn scan" id="scanReceiptBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="3"/></svg>
            Scan &amp; fill
          </button>
          <button type="button" class="receipt-btn" id="attachReceiptBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h2l1.5-2h9L18 7h2a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></svg>
            Just attach
          </button>
        </div>
      </div>
      <input type="file" id="receiptFileScan" accept="image/*" capture="environment" style="display:none;">
      <input type="file" id="receiptFileAttach" accept="image/*" capture="environment" style="display:none;">
    `;
    wireSlotButtons();
  }

  // Resize/compress image client-side so localStorage doesn't bloat
  function resizeImage(file, maxDim){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>{
        const img = new Image();
        img.onload = ()=>{
          let w = img.width, h = img.height;
          if(w > h && w > maxDim){ h = Math.round(h * maxDim/w); w = maxDim; }
          else if(h > maxDim){ w = Math.round(w * maxDim/h); h = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.72));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function handleAttachOnly(file){
    if(!file) return;
    try{
      const dataUrl = await resizeImage(file, 1400);
      showReceiptPreview(dataUrl);
      setScanStatus('');
    }catch(err){
      toast('Could not load that photo');
    }
  }

  async function handleScanAndFill(file){
    if(!file) return;
    let dataUrl;
    try{
      dataUrl = await resizeImage(file, 1400);
    }catch(err){
      toast('Could not load that photo');
      return;
    }
    showReceiptPreview(dataUrl);
    setScanStatus(`<div class="scan-status"><div class="spinner"></div> Reading receipt…</div>`);

    try{
      const base64 = dataUrl.split(',')[1];
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          messages: [{
            role: "user",
            content: [
              { type: "image", source: { type: "base64", media_type: "image/jpeg", data: base64 } },
              { type: "text", text: `Read this receipt photo for a small guesthouse's expense ledger. Respond with ONLY a raw JSON object, no markdown fences, no preamble, no explanation. Use this exact shape:
{"amount": <number, total amount paid, no currency symbol, 0 if unreadable>, "vendor": "<store or vendor name, empty string if unreadable>", "category": "<one of: Utilities, Supplies, Maintenance, Staff, Food & Kitchen, Store Purchase, Other — pick the closest match>", "method": "<one of: Cash, Esewa, Phonepay, Nabil Bank, Atm, Other — guess Cash if unclear>", "note": "<short 3-6 word description of what was purchased, empty string if unclear>"}
If you cannot read the receipt clearly, make your best reasonable guess for category/method and use 0 for amount and empty strings for text fields you truly cannot determine. Do not invent specific numbers you cannot see.` }
            ]
          }]
        })
      });
      const data = await response.json();
      const textBlock = (data.content || []).map(b=>b.text||'').join('');
      const cleaned = textBlock.replace(/```json|```/g,'').trim();
      const parsed = JSON.parse(cleaned);

      if(parsed.amount) document.getElementById('ex_amount').value = parsed.amount;
      if(parsed.vendor) document.getElementById('ex_vendor').value = parsed.vendor;
      if(parsed.note) document.getElementById('ex_note').value = parsed.note;
      if(parsed.method){
        const methodSel = document.getElementById('ex_method');
        if([...methodSel.options].some(o=>o.value===parsed.method)) methodSel.value = parsed.method;
      }
      if(parsed.category && EXPENSE_CATEGORIES.includes(parsed.category)){
        selectedCat = parsed.category;
        document.querySelectorAll('#catPicker .cat-opt').forEach(x=>{
          x.classList.toggle('selected', x.dataset.cat===parsed.category);
        });
      }
      setScanStatus(`<div class="scan-status">✓ Filled from receipt — check the fields below before saving</div>`);
    }catch(err){
      setScanStatus(`<div class="scan-status error">Couldn't read that receipt automatically. The photo is saved — just fill in the details below.</div>`);
    }
  }

  function wireSlotButtons(){
    const scanBtn = document.getElementById('scanReceiptBtn');
    const attachBtn = document.getElementById('attachReceiptBtn');
    const fileScan = document.getElementById('receiptFileScan');
    const fileAttach = document.getElementById('receiptFileAttach');
    if(scanBtn) scanBtn.addEventListener('click', ()=>fileScan.click());
    if(attachBtn) attachBtn.addEventListener('click', ()=>fileAttach.click());
    if(fileScan) fileScan.addEventListener('change', (ev)=>handleScanAndFill(ev.target.files[0]));
    if(fileAttach) fileAttach.addEventListener('change', (ev)=>handleAttachOnly(ev.target.files[0]));
  }
  function wireRemoveReceipt(){
    const removeBtn = document.getElementById('removeReceiptBtn');
    if(removeBtn) removeBtn.addEventListener('click', ()=>{ showReceiptSlot(); setScanStatus(''); });
  }
  if(hasReceipt) wireRemoveReceipt();
  else wireSlotButtons();

  document.getElementById('saveExBtn').addEventListener('click', ()=>{
    const amount = Number(document.getElementById('ex_amount').value||0);
    const vendor = document.getElementById('ex_vendor').value.trim();
    const paidBy = document.getElementById('ex_paidby').value.trim();
    const method = document.getElementById('ex_method').value;
    const month = Number(document.getElementById('ex_month').value);
    const note = document.getElementById('ex_note').value.trim();

    if(!amount){ toast('Add an amount'); return; }

    const rec = {
      id: editingExpenseId || Math.random().toString(36).slice(2,9),
      amount, category: selectedCat, vendor, paidBy, method, month, note,
      receipt: receiptData || null
    };

    if(editingExpenseId){
      const idx = expenses.findIndex(x=>x.id===editingExpenseId);
      expenses[idx] = rec;
      toast('Expense updated');
    } else {
      expenses.push(rec);
      toast('Expense added');
    }
    try{
      saveExpenses();
    }catch(err){
      toast('Saved, but receipt image was too large to store');
      rec.receipt = null;
      if(editingExpenseId){ expenses[expenses.findIndex(x=>x.id===editingExpenseId)] = rec; }
      else { expenses[expenses.length-1] = rec; }
      saveExpenses();
    }
    closeSheet();
    switchTab(state.tab);
  });

  const delExBtn = document.getElementById('deleteExBtn');
  if(delExBtn){
    delExBtn.addEventListener('click', ()=>{
      expenses = expenses.filter(x=>x.id!==editingExpenseId);
      saveExpenses();
      closeSheet();
      toast('Expense deleted');
      switchTab(state.tab);
    });
  }
}

/* ============ INIT ============ */
document.getElementById('monthPill').textContent = `${NEPALI_MONTHS[state.month]} 2083`;

function refreshCalToggleUI(){
  document.querySelectorAll('#calToggle .cal-toggle-opt').forEach(el=>{
    el.classList.toggle('selected', el.dataset.fmt === state.dateFormat);
  });
}
document.querySelectorAll('#calToggle .cal-toggle-opt').forEach(el=>{
  el.addEventListener('click', ()=>{
    state.dateFormat = el.dataset.fmt;
    saveState();
    refreshCalToggleUI();
    switchTab(state.tab);
  });
});
refreshCalToggleUI();

switchTab(state.tab || 'bookings');
</script>
</body>
